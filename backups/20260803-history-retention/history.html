<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#173f5f"><title>FamilyHub History</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:18px 14px 44px;background:#f2f5f7;color:#263746;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1100px;margin:auto}h1{margin:0;color:#173f5f;font-size:25px}.sub{color:#6d7880;margin:2px 0 18px}.panel,.record{background:#fff;border:1px solid #dce5ea;border-radius:16px;box-shadow:0 3px 12px #173f5f12}.panel{padding:14px;margin-bottom:14px}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.filters label{font-size:12px;font-weight:700;color:#53636d}.filters input,.filters select{width:100%;margin-top:4px;padding:10px;border:1px solid #c9d5dc;border-radius:10px;background:#fff;color:#263746;font:inherit}.checks{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}.checks label{display:flex;align-items:center;gap:6px;font-weight:600}.checks input{width:18px;height:18px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.toolbar strong{font-size:17px}.toolbar button,.back{border:0;border-radius:10px;padding:9px 12px;background:#173f5f;color:#fff;text-decoration:none;font:inherit}.day{margin-top:16px}.day h2{font-size:15px;color:#53636d;margin:0 0 6px;padding-left:4px}.record{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;padding:11px 13px;margin:7px 0}.record .kind{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#68808d}.record .title{font-weight:650}.record .meta{font-size:12px;color:#76838b;margin-top:2px}.badge{border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;white-space:nowrap}.done{background:#d9f2e8;color:#17734f}.missed{background:#fde4e4;color:#a13c3c}.current{background:#e4edf8;color:#24577e}.empty{padding:24px;text-align:center;color:#75828b}.muted{color:#78858d;font-size:12px}@media(max-width:600px){body{padding:14px 10px}.record{grid-template-columns:1fr auto}.record .kind{grid-column:1/-1}.record .meta{font-size:11px}}
</style><style>.incomplete{background:#fff0c9;color:#8a6100}.actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}.complete{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#53636d;white-space:nowrap}.complete input{width:17px;height:17px;accent-color:#17734f}.badge{border:0}.clear{border:1px solid #e0b7b7;border-radius:999px;padding:5px 8px;background:#fff;color:#a13c3c;font-size:11px;white-space:nowrap}@media(max-width:600px){.actions{grid-column:1/-1;justify-content:flex-start}}</style></head><body><main>
<div class="toolbar"><div><h1>FamilyHub History</h1><div class="sub">Search and correct routines, chores, and current Portal lists.</div></div><a class="back" href="/">FamilyHub</a></div>
<section class="panel"><div class="filters">
<label>Person<select id="person"><option value="all">Everyone</option></select></label>
<label>List / type<select id="source"><option value="all">Everything</option><option value="chore">Chores</option><option value="routine">Routines</option><option value="list">Portal lists</option></select></label>
<label>Status<select id="status"><option value="all">Completed, incomplete, missed</option><option value="done">Completed</option><option value="incomplete">Incomplete</option><option value="missed">Missed</option><option value="current">Current list items</option></select></label>
<label>From<input id="from" type="date"></label><label>Through<input id="to" type="date"></label>
</div><div class="checks"><label><input type="checkbox" id="showChores" checked> Chores</label><label><input type="checkbox" id="showRoutines" checked> Routines</label><label><input type="checkbox" id="showLists"> Portal lists</label><label style="flex:1;min-width:180px"><input id="query" type="search" placeholder="Search item names…" style="width:100%;padding:9px;border:1px solid #c9d5dc;border-radius:9px;font:inherit"></label></div></section>
<section class="panel"><div class="toolbar"><strong id="summary">Loading…</strong><button onclick="clearFilters()">Reset filters</button></div><div id="results"></div></section>
</main><script>
let state={history:null,members:[],lists:[]};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>{let x=new Date(d);return new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10)};
function daysBack(n){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-n);return iso(d)}
function memberName(id){let m=state.members.find(x=>x.id===id);return m?m.name:'Unassigned'}
function completed(kind,id,date){let a=state.history?.[kind]?.completed||[];return a.some(x=>(x.choreId||x.itemId)===id&&x.date===date)}
function scheduled(item,date){let d=new Date(date+'T12:00:00');let day=d.getDay()||7;return !item.days||item.days.includes(day)}
function completionStatus(done,date){if(done)return 'done';return date>=iso(new Date())?'incomplete':'missed'}
function buildRows(){let out=[];let from=$('from').value||daysBack(30),to=$('to').value||iso(new Date());let kinds=[];if($('showChores').checked)kinds.push(['chore','chores']);if($('showRoutines').checked)kinds.push(['routine','items']);
for(let n=0;n<=60;n++){let date=daysBack(n);if(date<from||date>to)continue;for(let [kind,key] of kinds){for(let item of (state.history?.[kind+'s']?.[key]||[])){if(!scheduled(item,date))continue;let done=completed(kind,item.id,date);out.push({kind,id:item.id,date,title:item.title||item.name,memberId:item.memberId,status:completionStatus(done,date)})}}}
// Preserve completed records older than the generated missed-item window.
for(let [kind,key] of kinds){let defs=state.history?.[kind+'s']?.[key]||[],done=state.history?.[kind+'s']?.completed||[];for(let c of done){let id=c.choreId||c.itemId;if(!id||c.date<from||c.date>to||out.some(r=>r.kind===kind&&r.id===id&&r.date===c.date))continue;let item=defs.find(x=>x.id===id);if(item)out.push({kind,id,date:c.date,title:item.title||item.name,memberId:item.memberId,status:'done'})}}
if($('showLists').checked){for(let list of state.lists)for(let item of list.items||[])out.push({kind:'list',id:item.id,date:'',title:item.text,memberId:'',listName:list.name,status:'current',done:item.done})}return out}
function render(){let rows=buildRows(), person=$('person').value, source=$('source').value,status=$('status').value,q=$('query').value.trim().toLowerCase();rows=rows.filter(r=>(person==='all'||r.memberId===person)&&(source==='all'||r.kind===source)&&(status==='all'||r.status===status)&&(!q||r.title.toLowerCase().includes(q)));let groups={};for(let r of rows)(groups[r.date||'Current items']??=[]).push(r);let keys=Object.keys(groups).sort((a,b)=>b.localeCompare(a));$('summary').textContent=rows.length+' record'+(rows.length===1?'':'s');if(!keys.length){$('results').innerHTML='<div class="empty">No records match these filters.</div>';return}$('results').innerHTML=keys.map(date=>'<div class="day"><h2>'+esc(date)+'</h2>'+groups[date].map(r=>'<div class="record"><div class="kind">'+esc(r.kind==='chore'?'Chore':r.kind==='routine'?'Routine':'List')+'</div><div><div class="title">'+esc(r.title)+'</div><div class="meta">'+esc(r.memberId?memberName(r.memberId):r.listName||'Portal')+(r.kind==='list'?' · '+esc(r.listName):'')+'</div></div>'+(r.kind==='list'?'<span class="badge '+r.status+'">'+(r.done?'Picked up':'Open')+'</span>':'<div class="actions"><label class="complete"><input type="checkbox" '+(r.status==='done'?'checked ':'')+'onchange="setCompletion(\''+r.kind+'\',\''+r.id+'\',\''+r.date+'\',this.checked)"> Complete</label><span class="badge '+r.status+'">'+(r.status==='done'?'Complete':r.status==='incomplete'?'Incomplete':'Missed')+'</span><button class="clear" onclick="erase(\''+r.kind+'\',\''+r.id+'\',\''+r.date+'\')">Delete record</button></div>')+'</div>').join('')+'</div>').join('')}
async function setCompletion(kind,id,date,completed){let res=await fetch('/api/history',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,action:'setCompletion',...(kind==='chore'?{choreId:id}:{itemId:id}),date,completed})});if(!res.ok)throw new Error('server returned '+res.status);await refresh()}
async function erase(kind,id,date){if(!confirm('Delete this completion record?'))return;try{await setCompletion(kind,id,date,false)}catch(e){alert('Could not delete: '+e.message)}}
async function flip(kind,id,date,completed){try{await setCompletion(kind,id,date,completed)}catch(e){alert('Could not save: '+e.message)}}
function clearFilters(){$('person').value='all';$('source').value='all';$('status').value='all';$('showChores').checked=true;$('showRoutines').checked=true;$('showLists').checked=false;$('query').value='';$('from').value=daysBack(30);$('to').value=iso(new Date());render()}
async function refresh(){let [h,m,l]=await Promise.all([fetch('/api/history').then(r=>r.json()),fetch('/api/members').then(r=>r.json()),fetch('/api/lists').then(r=>r.json())]);state={history:h,members:m,lists:l};let p=$('person'),old=p.value,requested=new URLSearchParams(location.search).get('person');p.innerHTML='<option value="all">Everyone</option>'+m.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('');p.value=m.some(x=>x.id===old)?old:(m.some(x=>x.id===requested)?requested:'all');render()}
['person','source','status','from','to','showChores','showRoutines','showLists','query'].forEach(id=>$(id).addEventListener('input',render));$('from').value=daysBack(30);$('to').value=iso(new Date());refresh().catch(e=>$('results').innerHTML='<div class="empty">Could not load history: '+esc(e.message)+'</div>');
</script></body></html>
