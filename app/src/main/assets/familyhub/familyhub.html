<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FamilyHub</title>
<style>
:root{--navy:#104368;--dark:#0b3352;--paper:#f4f7fa;--teal:#2cc2b8;--coral:#ff677a}*{box-sizing:border-box}body{margin:0;background:var(--navy);font:16px system-ui;color:#14263a}header{height:72px;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--dark);color:white}button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}header button{background:#1d567e;color:#fff;font-size:20px}h1{font-size:23px;flex:1;text-align:center;margin:0}.wrap{max-width:760px;margin:auto;padding:14px}.search{width:100%;padding:14px;border:0;border-radius:12px;background:#1d567e;color:#fff;font-size:16px}.search::placeholder{color:#b8d2e1}.meta{color:#dcebf5;padding:10px 2px}.rows{display:grid;gap:8px}.row{display:flex;align-items:center;gap:10px;background:#f7fafc;border-radius:10px;padding:8px}.row.done{background:#e0f5f2;color:#888;text-decoration:line-through}.check{width:38px;height:38px;padding:0;border:2px solid #000;border-radius:7px;background:#fff;color:#2cc2b8;font-size:22px}.name{flex:1;font-size:17px}.owner{font-size:12px;color:#fff;border-radius:999px;padding:4px 8px;font-weight:700;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}.del{background:none;color:var(--coral);font-size:23px}.add{position:sticky;bottom:10px;background:var(--dark);border-radius:18px;padding:12px;margin-top:14px;display:flex;gap:8px}.add input{flex:1;border:0;border-radius:10px;padding:14px;font-size:17px}.add button{font-size:24px}.drawer{position:fixed;inset:0 auto 0 0;width:290px;background:#d5e8f4;padding:24px 14px;box-shadow:8px 0 24px #0005;z-index:3}.drawer h2{color:var(--navy)}.drawer button{display:block;width:100%;text-align:left;margin:7px 0;background:#eff7fc;color:var(--navy)}.shade{position:fixed;inset:0;background:#0007;z-index:2}.hidden{display:none}select{padding:10px;border-radius:10px}
 .owner{text-shadow:none!important}.list-actions{display:flex;gap:8px;margin:8px 0}.list-actions button{flex:1;border-radius:999px;background:#1d567e;color:#fff}
 </style>
<div id="shade" class="shade hidden" onclick="closeDrawer()"></div><aside id="drawer" class="drawer hidden"><h2>FamilyHub</h2><b>PORTAL LISTS</b><div id="lists"></div><button onclick="chooseServer()">Choose server</button><button onclick="location.href='/familyhub.html'">Refresh</button><button onclick="closeDrawer()">Close</button></aside>
<header><button onclick="openDrawer()">☰</button><h1 id="title">Groceries</h1><button onclick="sortDialog()">▽</button></header>
<main class="wrap"><input id="search" class="search" placeholder="Search this list" oninput="render()"><div id="meta" class="meta"></div><div class="list-actions"><button onclick="clearDone()">Clear Done</button><button onclick="undoClearDone()">Undo Clear Done</button><button onclick="deleteList()">Delete List</button></div><div id="rows" class="rows"></div><div class="add"><input id="newItem" placeholder="Item" onkeydown="if(event.key==='Enter')addItem()"><button onclick="addItem()">+</button></div><p id="status" class="meta"></p></main>
<script>
let lists=[],members=[],selected='Groceries',current=null,sort=0,base=location.protocol+'//'+location.hostname+':8090';
const $=id=>document.getElementById(id); const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function ownerFg(c){let h=String(c||'').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');let r=parseInt(h.slice(0,2),16)||0,g=parseInt(h.slice(2,4),16)||0,b=parseInt(h.slice(4,6),16)||0;return (0.299*r+0.587*g+0.114*b)>160?'#101820':'#fff'}
async function api(path,opt){let r=await fetch(base+path,opt);if(!r.ok)throw Error('Portal returned HTTP '+r.status);return r.json()}
async function load(){try{[lists,members]=await Promise.all([api('/api/lists'),api('/api/members')]);current=lists.find(x=>x.name.toLowerCase()===selected.toLowerCase())||null;render();$('status').textContent='';}catch(e){$('status').textContent='Can’t reach Portal — check Tailscale or server address.'}}
function render(){if(!current){$('title').textContent=selected;$('meta').textContent='No '+selected+' list found';$('rows').innerHTML='';return}$('title').textContent=current.name;let q=$('search').value.toLowerCase();let a=(current.items||[]).filter(x=>x.text.toLowerCase().includes(q));if(sort===1)a.sort((x,y)=>x.text.localeCompare(y.text));if(sort===2)a.sort((x,y)=>y.text.localeCompare(x.text));if(sort===0)a.sort((x,y)=>Number(x.done)-Number(y.done));let done=a.filter(x=>x.done).length;$('meta').textContent=(a.length-done)+' to pick up • '+done+' picked up';$('rows').innerHTML=a.map(x=>{let m=members.find(m=>m.id===x.ownerId);return `<div class="row ${x.done?'done':''}"><button class="check" onclick="toggle('${x.id}')">${x.done?'✓':''}</button><span class="name">${esc(x.text)}</span>${m?`<span class="owner" style="background:${esc(m.color)}">${esc(m.name)}</span>`:''}<button class="del" onclick="removeItem('${x.id}')">×</button></div>`}).join('')}
async function mutate(o){let r=await api('/api/lists',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});lists=r;current=lists.find(x=>x.id===current.id)||current;render()}
async function toggle(id){await mutate({action:'toggleItem',listId:current.id,itemId:id})} async function removeItem(id){await mutate({action:'deleteItem',listId:current.id,itemId:id})}
async function clearDone(){if(!current)return;await mutate({action:'clearDone',listId:current.id})} async function undoClearDone(){if(!current)return;await mutate({action:'undoClearDone',listId:current.id})}
async function deleteList(){if(!current||!confirm(`Delete ${current.name} and all its items?`))return;await mutate({action:'deleteList',listId:current.id});selected='Groceries';load()}
async function addItem(){let v=$('newItem').value.trim();if(!v)return;if(current&&current.name.toLowerCase()==='tasks'){let owner=prompt('Whose task? Matt, Juanita, Kaylee, or Jesse');if(!owner)return;let m=members.find(x=>x.name.toLowerCase()===owner.toLowerCase()||(owner.toLowerCase()==='matt'&&x.name.toLowerCase()==='mathieu'));if(!m){$('status').textContent='Choose a known family member';return}await mutate({action:'addItem',listId:current.id,text:v,ownerId:m.id});}else{await api('/api/shopping/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({operation:'add',item:v})});load()}$('newItem').value=''}
function openDrawer(){$('drawer').classList.remove('hidden');$('shade').classList.remove('hidden');$('lists').innerHTML=lists.map(x=>{let m=members.find(m=>m.id===x.ownerId);return `<button onclick="selected='${esc(x.name)}';closeDrawer();load()">${esc(x.name)}${m?` <span class="owner" style="background:${esc(m.color)};color:${ownerFg(m.color)}">${esc(m.name)}</span>`:''}</button>`}).join('')}
function closeDrawer(){$('drawer').classList.add('hidden');$('shade').classList.add('hidden')} function sortDialog(){let s=prompt('Sort: 0 pending first, 1 name A–Z, 2 name Z–A',String(sort));if(s!==null&&/^[0-2]$/.test(s)){sort=Number(s);render()}} function chooseServer(){let s=prompt('Portal API base URL',base);if(s)base=s.replace(/\/$/,'')}
load();
</script>
